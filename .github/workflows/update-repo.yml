name: Update mcs fdroid repository

on:
  push:
    branches: [ main ]
  schedule:
    # Run automatically every night at midnight (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies, Java & Latest fdroidserver
        run: |
          sudo apt-get update
          # Install Java, Android tools, and required C-libraries
          sudo apt-get install -y openjdk-17-jdk libxml2-dev libxslt-dev zlib1g-dev
          
          # Upgrade pip and install the latest fdroidserver + updated androguard
          python3 -m pip install --upgrade pip
          python3 -m pip install fdroidserver androguard

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.p12

      - name: Run fdroid update
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FDROID_KEY_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          fdroid update --create-metadata --verbose

      - name: Clean up Keystore
        if: always()
        run: rm -f keystore.p12

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
