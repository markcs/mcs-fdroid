name: Update mcs fdroid repository

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Code with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies, Java & Latest fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk libxml2-dev libxslt-dev zlib1g-dev
          
          python3 -m pip install --upgrade pip
          python3 -m pip install fdroidserver androguard

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.p12

      - name: Verify Keystore Password & Alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore keystore.p12 -storepass "$KEYSTORE_PASSWORD" -alias repo_key

      - name: Configure fdroid with secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 << 'EOF'
          import os
          import yaml
          
          with open('config.yml', 'r') as f:
              config = yaml.safe_load(f)
          
          config['keystorepass'] = os.environ['KEYSTORE_PASSWORD']
          config['keypass'] = os.environ['KEY_PASSWORD']
          
          with open('config.yml', 'w') as f:
              yaml.dump(config, f)
          EOF

      - name: Run fdroid update
        run: |
          mkdir -p repo
          if compgen -G "repo/*.apk" > /dev/null; then
            echo "APKs detected. Updating F-Droid index..."
            fdroid update --create-metadata --verbose
          else
            echo "No APK files found in repo/. Skipping index update."
          fi

      - name: Clean up Keystore
        if: always()
        run: rm -f keystore.p12

      # --- CRITICAL FIX FOR GH-PAGES LFS OVER 100MB ---
      - name: Configure LFS for gh-pages publish directory
        run: |
          cd repo
          git lfs install
          echo "*.apk filter=lfs diff=lfs merge=lfs -text" > .gitattributes
      # ------------------------------------------------

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
