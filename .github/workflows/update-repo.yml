name: Update mcs fdroid repository

on:
  push:
    branches: [ main ]
  schedule:
    # Run automatically every night at midnight (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies, Java & Latest fdroidserver
        run: |
          sudo apt-get update
          # Install Java, Android tools, and required C-libraries
          sudo apt-get install -y openjdk-17-jdk libxml2-dev libxslt-dev zlib1g-dev
          
          # Upgrade pip and install the latest fdroidserver + updated androguard
          python3 -m pip install --upgrade pip
          python3 -m pip install fdroidserver androguard

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.p12

      - name: Verify Keystore Password & Alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Tests whether keytool can unlock the keystore with the secret
          keytool -list -v -keystore keystore.p12 -storepass "$KEYSTORE_PASSWORD" -alias repo_key

      - name: Configure fdroid with secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 << 'EOF'
          import os
          import yaml
          
          with open('config.yml', 'r') as f:
              config = yaml.safe_load(f)
          
          config['keystorepass'] = os.environ['KEYSTORE_PASSWORD']
          config['keypass'] = os.environ['KEY_PASSWORD']
          
          with open('config.yml', 'w') as f:
              yaml.dump(config, f)
          EOF

      - name: Download Large APK for Indexing
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          mkdir -p repo
          rm -f repo/HUAWEI*.apk
          
          # 1. Find the latest release tag starting with "HAC"
          LATEST_TAG=$(gh release list --repo markcs/releases --json tagName,isLatest --jq '[.[] | select(.tagName | startswith("HAC"))][0].tagName')
          echo "Latest release tag found: $LATEST_TAG"

          # 2. Get the highest versioned APK inside that tag
          LATEST_APK=$(gh release view "$LATEST_TAG" --repo markcs/releases --json assets --jq '.assets[].name | select(endswith(".apk"))' | sort -V | tail -n1)
          echo "Downloading latest version: $LATEST_APK"

          # 3. Download the APK
          gh release download "$LATEST_TAG" --repo markcs/releases --pattern "$LATEST_APK" --clobber --dir repo/
          
      - name: Build Repository Index
        env:
          KEYPASS: ${{ secrets.FDROID_KEYPASS }}
          STOREPASS: ${{ secrets.FDROID_STOREPASS }}
        run: |
          fdroid update --create-metadata

      - name: Run fdroid update
        run: |
          fdroid update --create-metadata --verbose
            
      - name: Clean up Keystore
        if: always()
        run: rm -f keystore.p12

        # --- ADD THIS CLEANUP STEP ---
      - name: Remove Large APKs Before Pushing Metadata to Git
        run: |
          echo "Removing heavy APK binaries so git commit stays under 100MB..."
          rm -f repo/HUAWEI*.apk

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages

      - name: Deploy built F-Droid files to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./repo
          keep_files: false
